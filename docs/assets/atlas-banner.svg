<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Atlas — your team's engineering memory</title>
  <desc id="description">A shared engineering workspace connecting people, code, decisions, and evidence. Built on FalkorDB.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1324"/>
      <stop offset="1" stop-color="#162540"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#647bff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#647bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <ellipse cx="1080" cy="200" rx="300" ry="280" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
