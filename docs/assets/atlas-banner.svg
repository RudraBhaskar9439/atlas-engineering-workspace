    <text x="57" y="237" fill="#a4b5ff" font-size="45" font-weight="700" letter-spacing="-1">engineering memory.</text>
    <text x="59" y="285" fill="#bdc9dd" font-size="19">Connect people, code, decisions, and the evidence behind them.</text>
    <rect x="57" y="331" width="187" height="36" rx="18" fill="#223555"/>
    <circle cx="77" cy="349" r="4" fill="#60d0b1"/>
    <text x="90" y="354" fill="#dce5ff" font-size="14" font-weight="700">Built on FalkorDB</text>
    <text x="263" y="354" fill="#aab9d2" font-size="14">Shared context. Considered action.</text>
    <g stroke="#5369a1" stroke-width="1.5" fill="none" opacity=".7">
      <path d="M940 97 1100 116 1162 234 1060 331 901 284 940 97"/>
