[project]
name = "atlas-company-brain"
version = "0.1.0"
description = "Evidence, decisions, and durable AI task memory on FalkorDB"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-dotenv>=1,<2",
  "falkordb==1.8.0", "authlib>=1.6,<2", "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3", "cryptography>=45", "litellm==1.105.1",
  "graphrag-sdk[litellm]==1.4.0", "graphiti-core[falkordb,google-genai]==0.31.1",
  "python-multipart>=0.0.20", "pydantic>=2.11,<3", "torch>=2.5"
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
